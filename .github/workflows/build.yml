name: Build Driver
on: [push]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install WDK
        run: |
          choco install windows-driver-kit -y --no-progress
        shell: pwsh

      - name: Build Driver
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find MSBuild\**\Bin\MSBuild.exe`) do set MSBUILD=%%i
          "%MSBUILD%" driver.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Upload driver.sys
        uses: actions/upload-artifact@v4
        with:
          name: driver
          path: x64\Release\driver.sys
