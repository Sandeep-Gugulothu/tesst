name: Build Driver
on: [push]
jobs:
  build:
    runs-on: windows-2019
    steps:
      - uses: actions/checkout@v4

      - name: Install WDK
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2128854" -OutFile wdksetup.exe
          Start-Process -Wait wdksetup.exe -ArgumentList "/quiet", "/norestart"

      - name: Build Driver
        shell: cmd
        run: |
          "C:\Program Files (x86)\Microsoft Visual Studio\2019\Enterprise\MSBuild\Current\Bin\MSBuild.exe" driver.vcxproj /p:Configuration=Release /p:Platform=x64

      - name: Upload driver.sys
        uses: actions/upload-artifact@v4
        with:
          name: driver
          path: x64\Release\driver.sys
